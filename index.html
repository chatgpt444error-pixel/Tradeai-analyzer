<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TradeLens AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070b10;color:#e8edf5;font-family:Arial,sans-serif}
header{padding:18px 22px;background:#0c1118;border-bottom:1px solid #222b36;display:flex;justify-content:space-between}
.logo{font-size:22px;font-weight:800}.logo span{color:#19c37d}
main{max-width:1100px;margin:auto;padding:18px}
.card{background:#0e141c;border:1px solid #222b36;border-radius:10px;margin-bottom:15px;padding:18px}
h2{margin-top:0}
.upload{border:2px dashed #344153;border-radius:9px;padding:35px;text-align:center}
input[type=file]{display:none}
label{display:inline-block;padding:12px 18px;background:#1a2634;border-radius:7px;cursor:pointer}
#preview{display:none;width:100%;max-height:500px;object-fit:contain;margin-top:15px;border-radius:7px}
button{width:100%;padding:13px;border:0;border-radius:7px;background:#19c37d;color:#04140d;font-weight:bold;margin-top:14px}
button:disabled{opacity:.4}
#loading{display:none;color:#f5b942;margin-top:12px}
#result{display:none;white-space:pre-wrap;line-height:1.6;background:#0a1017;padding:16px;border-radius:8px}
.green{color:#19c37d}.red{color:#ef5350}.yellow{color:#f5b942}
</style>
</head>

<body>

<header>
<div class="logo">Trade<span>Lens</span> AI</div>
<div>● AI ANALYZER</div>
</header>

<main>

<div class="card">
<h2>📷 Analyze Your Trade</h2>
<p>Upload a TradingView, MT4, MT5 or broker screenshot.</p>

<div class="upload">
<label for="screenshot">Choose Trade Screenshot</label>
<input id="screenshot" type="file" accept="image/png,image/jpeg,image/webp">
<p id="filename">No screenshot selected</p>
</div>

<img id="preview">

<button id="analyze" disabled>ANALYZE TRADE</button>

<div id="loading">
Analyzing chart structure, price action, support/resistance and setup...
</div>
</div>

<div class="card">
<h2>📊 Analysis</h2>
<div id="result">
Upload a screenshot and press Analyze Trade.
</div>
</div>

</main>

<script>

const fileInput=document.getElementById("screenshot");
const preview=document.getElementById("preview");
const analyze=document.getElementById("analyze");
const result=document.getElementById("result");
const loading=document.getElementById("loading");

let file=null;

fileInput.onchange=()=>{

file=fileInput.files[0];

if(!file)return;

document.getElementById("filename").textContent=file.name;

preview.src=URL.createObjectURL(file);
preview.style.display="block";

analyze.disabled=false;
};

analyze.onclick=async()=>{

if(!file)return;

analyze.disabled=true;
loading.style.display="block";
result.style.display="none";

try{

const form=new FormData();

form.append("screenshot",file);

const response=await fetch(
"https://YOUR-BACKEND-URL/analyze",
{
method:"POST",
body:form
}
);

if(!response.ok){
throw new Error("Server returned "+response.status);
}

const data=await response.json();

result.textContent=data.analysis;
result.style.display="block";

}catch(error){

result.textContent=
"Analysis failed.\n\n"+
error.message+
"\n\nCheck that your backend is running and the backend URL is correct.";

result.style.display="block";

}

loading.style.display="none";
analyze.disabled=false;

};

</script>

</body>
</html>
