<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeAI Analyzer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px 20px;
            background: #111820;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #aeb8c4;
            font-size: 16px;
        }

        .box {
            margin: 30px 20px;
            padding: 25px;
            background: #151d27;
            border-radius: 15px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #2f80ed;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>TradeAI Analyzer</h1>
    <p>AI-powered trading chart analyzer</p>
</header>

<div class="box">
    <h2>Market Analysis</h2>
    <p>Analyze market structure, support/resistance, entries, stop-loss and risk/reward.</p>
    <button onclick="analyze()">Analyze Chart</button>
    <p id="result"></p>
</div>

<script>
function analyze() {
    document.getElementById("result").innerText =
        "Upload/chart analysis feature coming next.";
}
</script>

</body>
</html>
