<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeAI Analyzer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f14;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px 20px;
            background: #111820;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #aeb8c4;
            font-size: 16px;
        }

        .box {
            margin: 30px 20px;
            padding: 25px;
            background: #151d27;
            border-radius: 15px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #2f80ed;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<header>
    <h1>TradeAI Analyzer</h1>
    <p>AI-powered trading chart analyzer</p>
</header>

<div class="box">
    <h2>📊 TradeAI Chart Analyzer</h2>

    <p>Upload a trading chart and prepare it for analysis.</p>

    <input type="file" id="chartUpload" accept="image/*" onchange="previewChart()">

    <br><br>

    <img id="chartPreview"
         style="display:none; max-width:100%; border-radius:12px; margin-top:10px;">

    <br>

    <button onclick="analyze()">Analyze Chart</button>

    <div id="result" style="margin-top:20px;"></div>
</div>

<script>
function analyze() {
    document.getElementById("result").innerText =
        "Upload/chart analysis feature coming next.";
}
</script>

</body>
</html>
