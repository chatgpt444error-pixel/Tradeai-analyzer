<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b10">
<title>TradeLens - Trading Analysis</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#080b10;
--panel:#0f141c;
--panel2:#131a23;
--border:#252e3a;
--text:#e8edf5;
--muted:#7f8b9b;
--green:#19c37d;
--red:#ef5350;
--yellow:#f5b942;
--blue:#4d9fff;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
}

button,input,select{
font:inherit;
}

button{
cursor:pointer;
}

.topbar{
height:64px;
background:#0b0f15;
border-bottom:1px solid var(--border);
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-size:21px;
font-weight:800;
}

.logo span{
color:var(--green);
}

.status{
font-size:11px;
color:var(--green);
}

.controls{
display:flex;
gap:8px;
flex-wrap:wrap;
padding:12px 18px;
border-bottom:1px solid var(--border);
background:var(--panel);
}

select,
.tool,
input{
background:#121923;
color:#e8edf5;
border:1px solid var(--border);
border-radius:6px;
padding:9px 10px;
outline:none;
}

select:focus,
input:focus{
border-color:var(--blue);
}

.tool:hover{
border-color:var(--blue);
}

.layout{
display:grid;
grid-template-columns:minmax(0,1fr) 340px;
gap:12px;
padding:12px;
}

.card{
background:var(--panel);
border:1px solid var(--border);
border-radius:10px;
overflow:hidden;
}

.cardTitle{
padding:13px 14px;
border-bottom:1px solid var(--border);
font-weight:700;
display:flex;
align-items:center;
justify-content:space-between;
}

.chartHeader{
padding:13px 14px;
border-bottom:1px solid var(--border);
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.assetSymbol{
font-size:18px;
font-weight:800;
}

.assetInfo{
font-size:11px;
color:var(--muted);
margin-top:3px;
}

.price{
font-size:20px;
font-weight:800;
}

.up{
color:var(--green);
}

.down{
color:var(--red);
}

.timeframes{
display:flex;
gap:4px;
padding:8px 12px;
flex-wrap:wrap;
border-bottom:1px solid var(--border);
}

.tf{
border:0;
background:transparent;
color:var(--muted);
padding:7px 9px;
border-radius:5px;
font-size:12px;
}

.tf.active{
background:#1b2633;
color:#fff;
}

.chartTools{
display:flex;
gap:6px;
padding:9px 12px;
border-bottom:1px solid var(--border);
flex-wrap:wrap;
}

.chartWrap{
height:430px;
background:#090d13;
padding:8px;
}

canvas{
width:100%;
height:100%;
display:block;
}

.metrics{
display:grid;
grid-template-columns:repeat(4,1fr);
border-top:1px solid var(--border);
}

.metric{
padding:12px;
border-right:1px solid var(--border);
}

.metric:last-child{
border-right:0;
}

.metric label{
display:block;
font-size:10px;
color:var(--muted);
margin-bottom:5px;
}

.metric strong{
font-size:15px;
}

.sidebar{
display:flex;
flex-direction:column;
gap:12px;
}

.signal{
margin:14px;
padding:16px;
border-radius:8px;
background:#10251d;
border:1px solid #1c5c42;
text-align:center;
}

.signal strong{
display:block;
font-size:25px;
color:var(--green);
}

.signal small{
display:block;
margin-top:5px;
color:var(--muted);
}

.rows{
padding:6px 14px 12px;
}

.row{
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 0;
border-bottom:1px solid #1c232d;
font-size:13px;
}

.row:last-child{
border-bottom:0;
}

.label{
color:var(--muted);
}

/* SCREENSHOT ANALYZER */

.analyzer{
margin:12px;
padding:14px;
border:1px solid var(--border);
border-radius:9px;
background:#0b1017;
}

.uploadBox{
border:2px dashed #344153;
border-radius:8px;
padding:22px 12px;
text-align:center;
transition:.2s;
}

.uploadBox:hover{
border-color:var(--blue);
}

.uploadIcon{
font-size:30px;
margin-bottom:8px;
}

.uploadTitle{
font-weight:700;
margin-bottom:5px;
}

.uploadText{
font-size:11px;
color:var(--muted);
margin-bottom:12px;
}

.uploadButton{
display:inline-block;
background:#1b2633;
border:1px solid var(--border);
padding:9px 13px;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

#fileInput{
display:none;
}

.preview{
display:none;
margin-top:12px;
}

.preview img{
width:100%;
max-height:330px;
object-fit:contain;
background:#05080c;
border:1px solid var(--border);
border-radius:7px;
}

.fileName{
font-size:11px;
color:var(--muted);
margin-top:7px;
word-break:break-all;
}

.formGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-top:12px;
}

.formGroup label{
display:block;
font-size:10px;
color:var(--muted);
margin-bottom:5px;
}

.formGroup input{
width:100%;
}

.analyzeButton{
width:100%;
margin-top:10px;
padding:11px;
border:0;
border-radius:6px;
background:var(--green);
color:#06130d;
font-weight:800;
}

.analyzeButton:hover{
opacity:.9;
}

.analysisResult{
display:none;
margin-top:12px;
padding:12px;
border:1px solid var(--border);
border-radius:7px;
background:#101720;
}

.analysisResult h3{
font-size:14px;
margin-bottom:10px;
}

.resultLine{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #202936;
font-size:12px;
}

.resultLine:last-child{
border-bottom:0;
}

.level{
margin:12px 14px;
padding:10px;
border-radius:6px;
background:#121923;
border-left:3px solid var(--blue);
}

.level.red{
border-left-color:var(--red);
}

.level.green{
border-left-color:var(--green);
}

.level.yellow{
border-left-color:var(--yellow);
}

.level b{
display:block;
margin-bottom:4px;
}

.risk{
padding:14px;
}

.riskbar{
height:8px;
background:#202936;
border-radius:5px;
overflow:hidden;
margin:8px 0;
}

.riskfill{
height:100%;
width:35%;
background:var(--green);
}

.small{
font-size:11px;
color:var(--muted);
line-height:1.5;
}

.bottom{
padding:14
