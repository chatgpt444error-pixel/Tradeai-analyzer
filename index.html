<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b10">
<title>TradeLens — Trading Analysis</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b10;
  --panel:#0e131b;
  --panel2:#111823;
  --border:#202a36;
  --text:#e7edf5;
  --muted:#7f8b9b;
  --green:#19c37d;
  --red:#ef5350;
  --yellow:#f5b942;
  --blue:#4d9fff;
  --purple:#9b7cff;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.topbar{
  height:64px;
  background:#0b0f15;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
  letter-spacing:.5px;
}

.logoMark{
  width:34px;
  height:34px;
  border-radius:9px;
  background:linear-gradient(135deg,#19c37d,#1675ff);
  display:grid;
  place-items:center;
  font-weight:900;
  color:white;
}

.live{
  display:flex;
  align-items:center;
  gap:7px;
  color:#9ba7b7;
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
}

.topActions{
  display:flex;
  align-items:center;
  gap:8px;
}

.select{
  background:#121923;
  color:var(--text);
  border:1px solid var(--border);
  border-radius:7px;
  padding:9px 11px;
  outline:none;
}

.iconBtn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:#111720;
  color:#aab5c4;
  border-radius:8px;
}

.layout{
  max-width:1600px;
  margin:auto;
  padding:14px;
}

.marketStrip{
  display:grid;
  grid-template-columns:1.2fr repeat(4,1fr);
  gap:10px;
  margin-bottom:12px;
}

.marketCard{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  padding:13px;
}

.marketCard .name{
  color:var(--muted);
  font-size:11px;
  margin-bottom:6px;
}

.marketCard .price{
  font-size:18px;
  font-weight:750;
}

.change{
  font-size:11px;
  margin-top:5px;
}

.green{color:var(--green)}
.red{color:var(--red)}
.yellow{color:var(--yellow)}

.mainGrid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 330px;
  gap:12px;
}

.chartPanel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}

.chartHeader{
  padding:14px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.asset{
  display:flex;
  align-items:center;
  gap:10px;
}

.assetSymbol{
  font-size:18px;
  font-weight:800;
}

.assetInfo{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.timeframes{
  display:flex;
  gap:4px;
  flex-wrap:wrap;
}

.tf{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:7px 9px;
  border-radius:5px;
  font-size:12px;
}

.tf.active{
  color:white;
  background:#1b2633;
}

.chartTools{
  padding:9px 12px;
  border-bottom:1px solid var(--border);
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tool{
  background:#121923;
  border:1px solid var(--border);
  color:#a9b4c2;
  border-radius:5px;
  padding:6px 9px;
  font-size:11px;
